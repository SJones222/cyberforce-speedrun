# Known-good CyberForce anonymous FTP configuration.
listen=YES
listen_ipv6=NO
listen_port=21

anonymous_enable=YES
local_enable=NO
write_enable=NO
anon_world_readable_only=YES
anon_root=/srv/ftp
no_anon_password=YES

pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30010

use_localtime=YES
xferlog_enable=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
